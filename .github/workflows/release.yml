name: 构建并发布 v0.5

# 触发：推送 v* 标签（git push --tags），或手动运行
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 v0.5.1）"
        required: false
        default: "v0.5.1"

env:
  GITCODE_REPOSITORY: ${{ vars.GITCODE_REPOSITORY || 'ANTIMelody/YunX_DeskTop_Test' }}
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}

jobs:
  # ---------- 构建（Windows，含代码签名）----------
  build:
    name: 构建 x64（NSIS + MSI）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust（稳定版）
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 启用 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 校验更新签名密钥
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or
              [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "缺少更新签名私钥或密码，拒绝构建不可更新的 Release"
          }

      # ---------- 代码签名（可选）：配置了 WINDOWS_CERTIFICATE 才执行 ----------
      - name: 导入签名证书到用户证书库
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "code-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $cert = Get-PfxCertificate -FilePath $pfx
          $thumb = $cert.Thumbprint
          echo "THUMBPRINT=$thumb" >> $env:GITHUB_ENV
          CertUtil -user -importPFX $pfx proPwd:$env:WINDOWS_CERTIFICATE_PASSWORD > $null
          Write-Host "证书已导入: $thumb"

      - name: 注入签名配置（存在证书时）
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        shell: pwsh
        run: |
          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          if ($null -eq $conf.bundle.windows) { $conf.bundle.windows = @{} }
          $conf.bundle.windows.certificateThumbprint = $env:THUMBPRINT
          $conf.bundle.windows.digestAlgorithm = "sha256"
          $conf.bundle.windows.timestampUrl = "http://timestamp.digicert.com"
          $conf | ConvertTo-Json -Depth 20 | Set-Content $confPath -Encoding UTF8
          Write-Host "已注入代码签名配置"

      - name: 构建安装包（Tauri）
        run: pnpm tauri build --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 校验签名产物并生成 latest.json
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $out = "release-artifacts"
          New-Item -ItemType Directory -Force $out | Out-Null
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "无法确定发布标签" }
          $version = $tag.TrimStart('v')
          $nsis = Get-ChildItem "$bundle/nsis" -Filter "*_${version}_x64-setup.exe" | Select-Object -First 1
          $msi = Get-ChildItem "$bundle/msi" -Filter "*_${version}_x64_*.msi" | Select-Object -First 1
          if ($null -eq $nsis -or $null -eq $msi) { throw "NSIS/MSI 安装包不完整" }
          $nsisSig = "$($nsis.FullName).sig"
          $msiSig = "$($msi.FullName).sig"
          if (-not (Test-Path $nsisSig) -or -not (Test-Path $msiSig)) { throw "缺少 NSIS/MSI .sig，拒绝发布" }
          Copy-Item $nsis.FullName,$msi.FullName,$nsisSig,$msiSig -Destination $out
          $assetName = [Uri]::EscapeDataString($nsis.Name)
          $latest = @{
            version = $version
            notes = "YunX $tag"
            pub_date = [DateTime]::UtcNow.ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = (Get-Content $nsisSig -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/$tag/$assetName"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 8 | Set-Content "$out/latest.json" -Encoding utf8
          if (-not (Test-Path "$out/latest.json")) { throw "latest.json 生成失败" }
          Get-ChildItem $out | ForEach-Object { Write-Host "ARTIFACT: $($_.Name) ($($_.Length) bytes)" }

      - name: 上传产物（暂存）
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: release-artifacts/*
          if-no-files-found: error

  # ---------- 发布（GitHub + GitCode 双源）----------
  publish:
    name: 发布到 GitHub / GitCode
    runs-on: ubuntu-latest
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    env:
      # job 级 env 上下文不可引用 env（校验失败零 job），直接内联同一表达式
      TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist

      - name: 生成发布说明（取提交信息）
        id: notes
        shell: bash
        run: |
          echo "::group::Release notes"
          git log --oneline -1
          echo "---" > notes.md
          git log -1 --format='%s' >> notes.md
          echo "" >> notes.md
          cat notes.md
          echo "::endgroup::"

      # ---------- GitHub Release ----------
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: notes.md
          files: |
            dist/*.exe
            dist/*.msi
            dist/*.sig
            dist/latest.json
          draft: false
          prerelease: false

      # ---------- GitCode Release（OpenAPI v5）----------
      - name: 发布 GitCode Release
        if: env.TOKEN != ''
        shell: bash
        env:
          TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -e
          REPO="${{ env.GITCODE_REPOSITORY }}"
          TAG="${{ env.TAG_NAME }}"

          # 1. 检查是否已存在同名 Release
          CHECK=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "PRIVATE-TOKEN: ${TOKEN}" -H "Accept: application/json" \
            "https://api.gitcode.com/api/v5/repos/${REPO}/releases/tags/${TAG}")

          if [ "$CHECK" = "404" ]; then
            echo "创建 GitCode Release ${TAG} ..."
            BODY=$(jq -Rn '{tag_name:$t, name:$n, body:$b, prerelease:false}' \
              --arg t "$TAG" --arg n "$TAG" --arg b "$(sed ':a;N;$!ba;s/\n/\\n/g' notes.md)")
            curl -fsS -X POST \
              -H "PRIVATE-TOKEN: ${TOKEN}" -H "Accept: application/json" -H "Content-Type: application/json" \
              "https://api.gitcode.com/api/v5/repos/${REPO}/releases" \
              -d "$BODY" > /dev/null && echo "GitCode Release 已创建"
          else
            echo "GitCode Release ${TAG} 已存在，跳过创建"
          fi

          # 2. 上传每个资产：get upload_url → PUT（响应头/URL 不经 eval 拼接，杜绝注入）
          upload_asset() {
            local FILE="$1" NAME UPLOAD_INFO UPLOAD_URL
            NAME=$(basename "$FILE")
            echo "上传 $NAME ..."
            UPLOAD_INFO=$(curl -fsS \
              -H "PRIVATE-TOKEN: ${TOKEN}" -H "Accept: application/json" \
              "https://api.gitcode.com/api/v5/repos/${REPO}/releases/${TAG}/upload_url?file_name=${NAME}")
            UPLOAD_URL=$(echo "$UPLOAD_INFO" | jq -r '.url')
            case "$UPLOAD_URL" in
              https://*gitcode.com/*) : ;;
              *) echo "!! 非预期的上传地址，拒绝上传 $NAME：${UPLOAD_URL}"; return 1 ;;
            esac
            local ARGS=(curl -fsS -o /dev/null -X PUT --data-binary @"$FILE" "$UPLOAD_URL")
            while IFS=$'\t' read -r K V; do
              [ -n "$K" ] && ARGS+=(-H "$K: $V")
            done < <(echo "$UPLOAD_INFO" | jq -r '.headers | to_entries[] | [.key, .value] | @tsv')
            "${ARGS[@]}"
            echo "  → $NAME 上传完成"
          }

          for FILE in dist/*.exe dist/*.msi; do
            [ -f "$FILE" ] || continue
            upload_asset "$FILE"
          done

          # 3. 镜像 latest.json（平台 URL 改写为 GitCode），供应用内更新器 GitHub 失败时回退
          if [ -f dist/latest.json ]; then
            echo "上传 latest.json（URL 改写为 GitCode）..."
            sed "s#https://github.com/${{ github.repository }}/releases/download/#https://gitcode.com/${REPO}/releases/download/#g" \
              dist/latest.json > dist/latest.gitcode.json
            upload_asset dist/latest.gitcode.json
          else
            echo "!! dist/latest.json 不存在，GitCode 回退源不可用（更新器将只走 GitHub）"
          fi
